name: Build Audit Companion APK

on:
  push:
    paths:
      - "audit-companion/**"
      - ".github/workflows/build-audit-companion.yml"
  pull_request:
    paths:
      - "audit-companion/**"
      - ".github/workflows/build-audit-companion.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        working-directory: audit-companion
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload release APK (signed — install this one)
        uses: actions/upload-artifact@v4
        with:
          name: audit-companion-apk
          path: audit-companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audit-companion-apk-debug
          path: audit-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
