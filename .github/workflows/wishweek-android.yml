name: WishWeek Android

on:
  push:
    branches: ["main", "claude/new-session-aklplo"]
    paths:
      - "wishweek/**"
      - ".github/workflows/wishweek-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wishweek
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ashtons-wish-week-release-apk
          path: wishweek/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ashtons-wish-week-debug-apk
          path: wishweek/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: wishweek/app/build/reports/tests/
