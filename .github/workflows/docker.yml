name: Docker

# Build the container image on every push/PR (so the Dockerfile can't rot),
# and publish it to GitHub Container Registry on a version tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (only when publishing a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker build -t edi-mapcheck:smoke .
          docker run -d --name mc -p 8501:8501 edi-mapcheck:smoke
          for i in $(seq 1 30); do
            if [ "$(curl -s http://localhost:8501/_stcore/health)" = "ok" ]; then
              echo "healthy after ${i}s"; ok=1; break
            fi
            sleep 2
          done
          docker logs mc
          docker rm -f mc
          test "${ok:-0}" = "1"
