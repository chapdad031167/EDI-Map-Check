# EDI MapCheck — one command to run the app locally.
#
#   docker compose up
#
# then open http://localhost:8501. Ctrl-C to stop.

services:
  mapcheck:
    build: .
    image: edi-mapcheck
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      # The image defaults to shared mode, built for a host several people
      # can reach. This file is the laptop path, so it pins single: the
      # History page shows every run and keeps its database download
      # (Design 021). Deploying this compose file somewhere shared? Change
      # it to shared.
      - MAPCHECK_MODE=single
      # run history (baselines, trends) on a named volume, so it
      # survives container rebuilds (Design 016)
      - MAPCHECK_HISTORY_DB=/data/mapcheck_history.db
    volumes:
      - mapcheck-data:/data
    restart: unless-stopped

volumes:
  mapcheck-data:
