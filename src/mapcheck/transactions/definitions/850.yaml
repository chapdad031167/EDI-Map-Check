# X12 850 Purchase Order (v004010) — transaction definition for EDI MapCheck.
#
# Built from the public X12 850 structure. The segment lists are the
# commonly used commercial subset, not the exhaustive standard; unknown
# segments in a source file parse with a warning, they do not abort the
# run.

transaction:
  set: "850"
  name: Purchase Order
  functional_group: PO
  version: "004010"

structure:
  - area: header
    segments: [BEG, CUR, REF, PER, TAX, FOB, CTP, PAM, CSH, TC2, SAC, ITD,
               DIS, INC, DTM, LIN, SI, PID, MEA, PWK, PKG, TD1, TD5, TD3,
               TD4, MAN, PCT, CTB, TXI, N9, MSG]
    loops:
      - id: N1
        trigger: N1
        qualifier: 1
        segments: [N2, N3, N4, NX2, REF, PER, SI, FOB, TD1, TD5, TD3, TD4, PKG]
        max_repeats: 200

  - area: detail
    opens_area: [PO1]
    loops:
      - id: PO1
        trigger: PO1
        qualifier: 1
        max_repeats: 100000
        segments: [LIN, SI, CUR, CN1, PO3, CTP, PAM, MEA, PID, PWK, PO4,
                   REF, PER, SAC, IT8, CSH, ITD, DIS, INC, TAX, FOB, SDQ,
                   IT3, DTM, TC2, TD1, TD5, TD3, TD4, PCT, MAN, MSG, AMT,
                   N9, N1, N2, N3, N4, SLN]

  - area: summary
    opens_area: [CTT]
    segments: [CTT, AMT]

output_pairing:
  list_path: lines
  loop: PO1

reconciliation:
  - id: ctt-line-count
    description: CTT01 (number of line items) must equal the PO1 loop count
    left: { value: CTT01 }
    right: { count: PO1 }
    check: equals
    when: { exists: CTT01 }
    severity: warning

# Element dictionary for draft-spec's source walk (Design 012): element
# names in positional order, element 01 first. Commonly used commercial
# subset — segments without an entry don't enumerate in drafts.
elements:
  BEG: [Transaction Set Purpose Code, Purchase Order Type, Purchase Order Number,
        Release Number, Purchase Order Date]
  CUR: [Currency Entity Qualifier, Currency Code]
  REF: [Reference Identification Qualifier, Reference Identification]
  PER: [Contact Function Code, Contact Name, Communication Qualifier,
        Communication Number]
  DTM: [Date/Time Qualifier, Date]
  SAC: [Allowance or Charge Indicator, Allowance/Charge Code, Agency Qualifier,
        Agency Code, Amount]
  N1:  [Entity Identifier Code, Name, Identification Code Qualifier,
        Identification Code]
  N3:  [Address Line 1, Address Line 2]
  N4:  [City Name, State or Province Code, Postal Code]
  PO1: [Assigned Identification, Quantity Ordered, Unit of Measure Code,
        Unit Price, Basis of Unit Price Code, Product ID Qualifier,
        Product ID, Product ID Qualifier 2, Product ID 2]
  PID: [Item Description Type, Product Characteristic Code, Agency Qualifier,
        Product Description Code, Description]
  CTT: [Number of Line Items, Hash Total]
  AMT: [Amount Qualifier Code, Monetary Amount]

# Base-standard mandatory elements. Spec-independent: an 850 without these
# is defective no matter what any mapping spec says, so an empty value is a
# FAILURE, never NOT TESTED.
required_elements:
  - segment: BEG
    element: 3
    name: PO number
  # X12 850 syntax note C0302: if a unit of measure is sent, the quantity
  # is required with it.
  - segment: PO1
    element: 2
    name: quantity ordered
    when_present: 3
    when_name: unit of measure
