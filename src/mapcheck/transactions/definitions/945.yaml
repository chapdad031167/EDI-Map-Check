# X12 945 Warehouse Shipping Advice (v004010) — transaction definition.
#
# Detail lines are LX loops wrapping W12 shipped-item segments, per the
# common public companion guides. Element-usage assumptions (noted for
# amendment against a specific partner guide): W12 is read as
# 01=shipping status, 02=qty ordered, 03=qty shipped, 04=qty difference,
# 05=UOM, 06=UPC; W27 as 01=transport method, 02=SCAC.

transaction:
  set: "945"
  name: Warehouse Shipping Advice
  functional_group: SW
  version: "004010"

structure:
  - area: header
    segments: [W06, N9, G61, G62, W27, W10, W28, W29]
    loops:
      - id: N1
        trigger: N1
        qualifier: 1
        segments: [N2, N3, N4, PER]
        max_repeats: 10

  - area: detail
    opens_area: [LX]
    loops:
      - id: LX
        trigger: LX
        qualifier: 1
        max_repeats: 10000
        segments: [W12, G69, N9, QTY, AMT]

  - area: summary
    opens_area: [W03]
    segments: [W03]

output_pairing:
  list_path: lines
  loop: LX

reconciliation:
  - id: w03-shipped-sum
    description: W03 total units shipped must equal the sum of line W12 shipped quantities
    left: { value: W0301 }
    right: { sum: { loop: LX, value: W1203 } }
    check: equals
    when: { exists: W0301 }
    severity: warning

  # A short-ship is fine — an UNDECLARED short-ship is not: the ordered
  # minus shipped delta must equal the declared quantity differences.
  - id: short-ship-declared
    description: total ordered minus total shipped must equal the declared W12 quantity differences
    left:
      combine:
        add:
          - { sum: { loop: LX, value: W1202 } }
        subtract:
          - { sum: { loop: LX, value: W1203 } }
    right: { sum: { loop: LX, value: W1204 } }
    check: equals
    severity: warning
