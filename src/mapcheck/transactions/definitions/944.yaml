# X12 944 Warehouse Stock Transfer Receipt Advice (v004010).
#
# The transfer pair's receiving side. W17 header is read as 01=reporting
# code, 02=date received, 03=receipt number; W07 detail lines as
# 01=quantity received, 02=UOM, 03=UPC — assumptions noted for amendment
# against a specific partner guide. The W14 total reconciles against the
# received line quantities.

transaction:
  set: "944"
  name: Warehouse Stock Transfer Receipt Advice
  functional_group: RE
  version: "004010"

structure:
  - area: header
    segments: [W17, N9, G61, G62, W08, W28]
    loops:
      - id: N1
        trigger: N1
        qualifier: 1
        segments: [N2, N3, N4, PER]
        max_repeats: 10

  - area: detail
    opens_area: [W07]
    loops:
      - id: W07
        trigger: W07
        qualifier: 1
        max_repeats: 10000
        segments: [G69, N9, QTY]

  - area: summary
    opens_area: [W14]
    segments: [W14]

output_pairing:
  list_path: lines
  loop: W07

reconciliation:
  - id: w14-receipt-sum
    description: W14 total units received must equal the sum of W07 line quantities
    left: { value: W1401 }
    right: { sum: { loop: W07, value: W0701 } }
    check: equals
    when: { exists: W1401 }
    severity: warning
